kind = "web"
previewPath = "/"
title = "ParkEasy"
description = "An interactive parking lot system demo with a TypeScript web interface and a pure Java console implementation, both using in-memory state and beginner-friendly design patterns."
version = "1.0.0"
id = "artifacts/parkeasy"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21179

[services.development]
run = "pnpm --filter @workspace/parkeasy run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/parkeasy", "run", "build" ]
serve = "static"
publicDir = "artifacts/parkeasy/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21179"
BASE_PATH = "/"
